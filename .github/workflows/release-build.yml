name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.9.0)'
        required: false
        default: ''
      target:
        description: 'Build target'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos-only
          - windows-only
          - windows-installed-test
      installer_run_id:
        description: 'Existing Release Build run to test (windows-installed-test only)'
        required: false
        default: '38595479570'

jobs:
  test-installed-windows:
    name: Windows installed-app test
    runs-on: windows-latest
    timeout-minutes: 10
    if: ${{ github.event.inputs.target == 'windows-installed-test' }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ai-doc-quicklook-windows-installer
          path: installer
          run-id: ${{ inputs.installer_run_id }}
          github-token: ${{ github.token }}
      - name: Test installed app through Windows Shell
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer artifact not found' }
          ./scripts/test-windows-file-association.ps1 -Installer $installer.FullName
      - name: Upload installed-app test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-file-association-evidence
          path: ${{ runner.temp }}/file-association-report
          if-no-files-found: warn

  build-macos:
    name: macOS (aarch64)
    runs-on: macos-latest
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'macos-only' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Tauri build
        run: npx tauri build --target aarch64-apple-darwin

      - name: Build beta DMG with hdiutil
        run: scripts/build-macos-dmg.sh

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-doc-quicklook-macos-app
          path: src-tauri/target/**/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-doc-quicklook-macos-dmg
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'windows-only' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Test document tabs and save isolation
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test native paths and save outputs
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Tauri build
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Test installed file association and stale Open With repair
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target -Recurse -Filter '*_x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found' }
          ./scripts/test-windows-file-association.ps1 -Installer $installer.FullName -CheckRegistration

      - name: Upload installed-app test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-file-association-evidence
          path: ${{ runner.temp }}/file-association-report
          if-no-files-found: warn

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ai-doc-quicklook-windows-installer
          path: src-tauri/target/**/release/bundle/nsis/*_x64-setup.exe
          if-no-files-found: error

      - name: Upload unpacked .exe
        uses: actions/upload-artifact@v4
        with:
          name: ai-doc-quicklook-windows-exe
          path: src-tauri/target/**/release/md-quicklook.exe
          if-no-files-found: warn
